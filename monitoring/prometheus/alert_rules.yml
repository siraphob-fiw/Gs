groups:
  - name: strengthos-user-management-alerts
    rules:
      # Application Health Alerts
      - alert: ApplicationDown
        expr: up{job="strengthos-user-management"} == 0
        for: 1m
        labels:
          severity: critical
          service: user-management
        annotations:
          summary: "StrengthOS User Management API is down"
          description: "The StrengthOS User Management API has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(api_requests_total{status_code=~"5.."}[5m]) / rate(api_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes."

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(api_request_duration_ms_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}ms for the last 5 minutes."

      # Resource Usage Alerts
      - alert: HighMemoryUsage
        expr: (system_memory_heap_used_bytes / system_memory_heap_total_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }} for the last 5 minutes."

      - alert: HighCPUUsage
        expr: rate(system_cpu_user_microseconds[5m]) > 800000
        for: 5m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is high for the last 5 minutes."

      - alert: EventLoopLag
        expr: system_event_loop_lag_ms > 100
        for: 2m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "High event loop lag"
          description: "Event loop lag is {{ $value }}ms, indicating potential performance issues."

      # Database Alerts
      - alert: DatabaseConnectionFailure
        expr: database_queries_total{operation="connect", result="error"} > 0
        for: 1m
        labels:
          severity: critical
          service: user-management
        annotations:
          summary: "Database connection failures"
          description: "Database connection failures detected."

      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, rate(database_query_duration_ms_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "Slow database queries"
          description: "95th percentile database query time is {{ $value }}ms."

      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "High database connection count"
          description: "Database has {{ $value }} active connections."

      # Cache Alerts
      - alert: CacheConnectionFailure
        expr: cache_operations_total{operation="connect", result="error"} > 0
        for: 1m
        labels:
          severity: critical
          service: user-management
        annotations:
          summary: "Cache connection failures"
          description: "Redis cache connection failures detected."

      - alert: LowCacheHitRate
        expr: rate(cache_operations_total{result="hit"}[5m]) / rate(cache_operations_total[5m]) < 0.8
        for: 10m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} for the last 10 minutes."

      # Security Alerts
      - alert: SecurityViolation
        expr: increase(security_events_total{event_type="violation"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: user-management
        annotations:
          summary: "Security violation detected"
          description: "{{ $value }} security violations detected in the last 5 minutes."

      - alert: FailedAuthentications
        expr: rate(user_actions_total{action="login", result="failed"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "High failed authentication rate"
          description: "Failed authentication rate is {{ $value }} per second."

      - alert: SuspiciousActivity
        expr: increase(security_events_total{event_type="suspicious"}[5m]) > 10
        for: 0m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "Suspicious activity detected"
          description: "{{ $value }} suspicious activities detected in the last 5 minutes."

      # Business Metrics Alerts
      - alert: LowUserActivity
        expr: rate(user_actions_total[1h]) < 0.01
        for: 30m
        labels:
          severity: warning
          service: user-management
        annotations:
          summary: "Low user activity"
          description: "User activity is unusually low: {{ $value }} actions per second."

      - alert: HighTenantCreationRate
        expr: rate(user_actions_total{action="tenant_create"}[5m]) > 0.1
        for: 5m
        labels:
          severity: info
          service: user-management
        annotations:
          summary: "High tenant creation rate"
          description: "Tenant creation rate is {{ $value }} per second."

  - name: infrastructure-alerts
    rules:
      # System Resource Alerts
      - alert: HighSystemMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "High system memory usage"
          description: "System memory usage is {{ $value | humanizePercentage }}."

      - alert: HighSystemCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High system CPU usage"
          description: "System CPU usage is {{ $value | humanizePercentage }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Low disk space"
          description: "Disk space is {{ $value | humanizePercentage }} available."

      - alert: HighDiskIOWait
        expr: irate(node_cpu_seconds_total{mode="iowait"}[5m]) * 100 > 20
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High disk I/O wait"
          description: "Disk I/O wait time is {{ $value | humanizePercentage }}."

      # Network Alerts
      - alert: HighNetworkErrors
        expr: rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High network error rate"
          description: "Network error rate is {{ $value }} errors per second."

  - name: external-services-alerts
    rules:
      # External Service Alerts
      - alert: ExternalServiceDown
        expr: external_service_requests_total{result="error"} / external_service_requests_total > 0.5
        for: 5m
        labels:
          severity: critical
          service: external-integration
        annotations:
          summary: "External service experiencing issues"
          description: "External service {{ $labels.service }} has {{ $value | humanizePercentage }} error rate."

      - alert: PaymentProcessingFailure
        expr: increase(payment_processing_total{result="failed"}[5m]) > 5
        for: 0m
        labels:
          severity: critical
          service: payment
        annotations:
          summary: "Payment processing failures"
          description: "{{ $value }} payment processing failures in the last 5 minutes."

      - alert: EmailDeliveryFailure
        expr: increase(email_notifications_total{result="failed"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: notification
        annotations:
          summary: "Email delivery failures"
          description: "{{ $value }} email delivery failures in the last 5 minutes."