apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "strengthos-user-management.fullname" . }}
  labels:
    {{- include "strengthos-user-management.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "strengthos-user-management.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "strengthos-user-management.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "strengthos-user-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel }}
            - name: PORT
              value: {{ .Values.config.port | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment }}
            
            # Database configuration
            - name: DATABASE_HOST
              value: {{ .Values.config.database.host }}
            - name: DATABASE_PORT
              value: {{ .Values.config.database.port | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.config.database.name }}
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret }}
                  key: {{ .Values.secrets.database.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret }}
                  key: {{ .Values.secrets.database.passwordKey }}
            - name: DATABASE_SSL
              value: {{ .Values.config.database.ssl | quote }}
            - name: DATABASE_POOL_MIN
              value: {{ .Values.config.database.poolMin | quote }}
            - name: DATABASE_POOL_MAX
              value: {{ .Values.config.database.poolMax | quote }}
            
            # Redis configuration
            - name: REDIS_HOST
              value: {{ .Values.config.redis.host }}
            - name: REDIS_PORT
              value: {{ .Values.config.redis.port | quote }}
            - name: REDIS_DB
              value: {{ .Values.config.redis.db | quote }}
            - name: REDIS_KEY_PREFIX
              value: {{ .Values.config.redis.keyPrefix }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redis.existingSecret }}
                  key: {{ .Values.secrets.redis.passwordKey }}
            
            # JWT configuration
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwt.existingSecret }}
                  key: {{ .Values.secrets.jwt.accessSecretKey }}
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwt.existingSecret }}
                  key: {{ .Values.secrets.jwt.refreshSecretKey }}
            - name: JWT_ACCESS_TOKEN_EXPIRY
              value: {{ .Values.config.jwt.accessTokenExpiry }}
            - name: JWT_REFRESH_TOKEN_EXPIRY
              value: {{ .Values.config.jwt.refreshTokenExpiry }}
            
            # Stripe configuration
            {{- if .Values.externalServices.stripe.enabled }}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.stripe.existingSecret }}
                  key: {{ .Values.secrets.stripe.secretKeyKey }}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.stripe.existingSecret }}
                  key: {{ .Values.secrets.stripe.webhookSecretKey }}
            {{- end }}
            
            # Rate limiting
            - name: RATE_LIMIT_WINDOW_MS
              value: {{ .Values.config.rateLimit.windowMs | quote }}
            - name: RATE_LIMIT_MAX
              value: {{ .Values.config.rateLimit.max | quote }}
            
            # CORS configuration
            - name: CORS_ORIGIN
              value: {{ .Values.config.cors.origin | join "," }}
            - name: CORS_CREDENTIALS
              value: {{ .Values.config.cors.credentials | quote }}
          
          {{- if .Values.healthCheck.enabled }}
          livenessProbe:
            {{- toYaml .Values.healthCheck.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.healthCheck.readinessProbe | nindent 12 }}
          {{- end }}
          
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}