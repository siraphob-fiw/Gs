version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: strengthos-postgres
    environment:
      POSTGRES_DB: gym_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: strengthos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Application (New NestJS-based API)
  api:
    build:
      context: ./apps/sos-web-api
      dockerfile: Dockerfile
    container_name: strengthos-api
    environment:
      NODE_ENV: development
      PORT: 3001
      # Database Configuration - Standardized naming
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gym_db
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: gym_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SSL: false
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 10
      DATABASE_TIMEOUT: 30000
      # Redis Configuration - Standardized naming
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_TIMEOUT: 5000
      REDIS_POOL_MIN: 1
      REDIS_POOL_MAX: 5
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./apps/sos-web-api/logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge