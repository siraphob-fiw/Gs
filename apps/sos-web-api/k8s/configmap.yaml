apiVersion: v1
kind: ConfigMap
metadata:
  name: sos-web-api-config
  namespace: strengthos-production
data:
  NODE_ENV: "production"
  PORT: "3000"
  API_VERSION: "v1"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  ENABLE_SWAGGER: "false"
  ENABLE_METRICS: "true"
  ENABLE_AUDIT_LOGGING: "true"
  ENABLE_REQUEST_LOGGING: "true"
  ENABLE_PERFORMANCE_MONITORING: "true"
  COMPRESSION_LEVEL: "6"
  COMPRESSION_THRESHOLD: "1024"
  CACHE_TTL: "300000"
  SESSION_TIMEOUT: "3600000"
  HEALTH_CHECK_TIMEOUT: "5000"
  HEALTH_CHECK_INTERVAL: "30000"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  BCRYPT_ROUNDS: "12"
  JWT_EXPIRES_IN: "3600"
  JWT_REFRESH_EXPIRES_IN: "2592000"
  BACKUP_ENABLED: "true"
  BACKUP_SCHEDULE: "0 2 * * *"
  BACKUP_RETENTION_DAYS: "30"
  FORCE_HTTPS: "true"
  CLUSTER_ENABLED: "true"
  CLUSTER_WORKERS: "0"
  SHUTDOWN_TIMEOUT: "30000"
  KEEP_ALIVE_TIMEOUT: "65000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sos-web-api-config
  namespace: strengthos-staging
data:
  NODE_ENV: "staging"
  PORT: "3000"
  API_VERSION: "v1"
  LOG_LEVEL: "debug"
  LOG_FORMAT: "json"
  ENABLE_SWAGGER: "true"
  ENABLE_METRICS: "true"
  ENABLE_AUDIT_LOGGING: "true"
  ENABLE_REQUEST_LOGGING: "true"
  ENABLE_PERFORMANCE_MONITORING: "true"
  COMPRESSION_LEVEL: "4"
  COMPRESSION_THRESHOLD: "1024"
  CACHE_TTL: "300000"
  SESSION_TIMEOUT: "3600000"
  HEALTH_CHECK_TIMEOUT: "5000"
  HEALTH_CHECK_INTERVAL: "30000"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "200"
  BCRYPT_ROUNDS: "10"
  JWT_EXPIRES_IN: "3600"
  JWT_REFRESH_EXPIRES_IN: "2592000"
  BACKUP_ENABLED: "true"
  BACKUP_SCHEDULE: "0 3 * * *"
  BACKUP_RETENTION_DAYS: "7"
  FORCE_HTTPS: "true"
  CLUSTER_ENABLED: "false"
  CLUSTER_WORKERS: "1"
  SHUTDOWN_TIMEOUT: "30000"
  KEEP_ALIVE_TIMEOUT: "65000"