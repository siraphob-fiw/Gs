apiVersion: v1
kind: Service
metadata:
  name: sos-web-api-service
  namespace: strengthos-production
  labels:
    app: sos-web-api
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/api/v1/health"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "30"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-unhealthy-threshold: "3"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 3000
    protocol: TCP
    name: https
  selector:
    app: sos-web-api
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: sos-web-api-service
  namespace: strengthos-staging
  labels:
    app: sos-web-api
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: sos-web-api
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: sos-web-api-headless
  namespace: strengthos-production
  labels:
    app: sos-web-api
    environment: production
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: sos-web-api
---
apiVersion: v1
kind: Service
metadata:
  name: sos-web-api-headless
  namespace: strengthos-staging
  labels:
    app: sos-web-api
    environment: staging
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: sos-web-api