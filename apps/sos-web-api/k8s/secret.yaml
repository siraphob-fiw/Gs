apiVersion: v1
kind: Secret
metadata:
  name: sos-web-api-secrets
  namespace: strengthos-production
type: Opaque
stringData:
  DATABASE_URL: "postgresql://username:password@postgres-service:5432/strengthos_prod"
  REDIS_URL: "redis://redis-service:6379"
  REDIS_PASSWORD: "your-redis-password"
  JWT_SECRET: "your-super-secure-jwt-secret-key-here"
  JWT_REFRESH_SECRET: "your-super-secure-refresh-secret-key-here"
  SENDGRID_API_KEY: "your-sendgrid-api-key"
  STRIPE_SECRET_KEY: "sk_live_your-stripe-secret-key"
  STRIPE_WEBHOOK_SECRET: "whsec_your-webhook-secret"
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  SENTRY_DSN: "https://your-sentry-dsn@sentry.io/project-id"
  NEW_RELIC_LICENSE_KEY: "your-newrelic-license-key"
  DATADOG_API_KEY: "your-datadog-api-key"
  BACKUP_S3_BUCKET: "strengthos-prod-backups"
  AWS_S3_BUCKET: "strengthos-prod-uploads"
---
apiVersion: v1
kind: Secret
metadata:
  name: sos-web-api-secrets
  namespace: strengthos-staging
type: Opaque
stringData:
  DATABASE_URL: "postgresql://username:password@postgres-service:5432/strengthos_staging"
  REDIS_URL: "redis://redis-service:6379"
  REDIS_PASSWORD: "your-redis-password"
  JWT_SECRET: "your-staging-jwt-secret-key-here"
  JWT_REFRESH_SECRET: "your-staging-refresh-secret-key-here"
  SENDGRID_API_KEY: "your-sendgrid-test-api-key"
  STRIPE_SECRET_KEY: "sk_test_your-stripe-test-secret-key"
  STRIPE_WEBHOOK_SECRET: "whsec_your-test-webhook-secret"
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  SENTRY_DSN: "https://your-staging-sentry-dsn@sentry.io/project-id"
  NEW_RELIC_LICENSE_KEY: "your-newrelic-license-key"
  DATADOG_API_KEY: "your-datadog-api-key"
  BACKUP_S3_BUCKET: "strengthos-staging-backups"
  AWS_S3_BUCKET: "strengthos-staging-uploads"